services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caritalent_app
    environment:
      APP_NAME: CariTalent
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-caritalent_db}
      DB_USERNAME: ${DB_USERNAME:-caritalent_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - caritalent_net

  nginx:
    image: nginx:1.27-alpine
    container_name: caritalent_nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - caritalent_net

  db:
    image: postgres:16-alpine
    container_name: caritalent_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-caritalent_db}
      POSTGRES_USER: ${DB_USERNAME:-caritalent_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Hanya expose secara internal — TIDAK dibuka ke publik
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - caritalent_net

volumes:
  pgdata:
  app_storage:

networks:
  caritalent_net:
    driver: bridge
